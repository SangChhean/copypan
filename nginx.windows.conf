worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        # Relative to nginx prefix (e.g. C:/nginx-1.24.0); start_all.bat deploys dist here.
        root   html;
        index  index.html index.htm;

        client_max_body_size 100m;

        location /api/ai_search/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location /api/ws/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/process {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 1800;
            proxy_send_timeout 1800;
            client_max_body_size 100m;
        }

        location /api/testa/translate/ {
            proxy_pass http://127.0.0.1:8002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/testa/church {
            proxy_pass http://127.0.0.1:8011;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
        }

        location /api/testa/memorial {
            proxy_pass http://127.0.0.1:8011;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
        }

        location /api/testa/memorial_roles {
            proxy_pass http://127.0.0.1:8011;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/testa/polish {
            proxy_pass http://127.0.0.1:8011;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
        }

        location /api/testa/styles {
            proxy_pass http://127.0.0.1:8011;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/testa/feast_outline {
            proxy_pass http://127.0.0.1:8024;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
        }

        location /api/testa/rough_outline {
            proxy_pass http://127.0.0.1:8027;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }

        location /api/testa/bird_view {
            proxy_pass http://127.0.0.1:8021;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
        }

        location /api/testa/generate_outline/ {
            proxy_pass http://127.0.0.1:8007;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location /api/testa/ministerialize {
            proxy_pass http://127.0.0.1:8030;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }

        location /api/testa/ {
            proxy_pass http://127.0.0.1:8004;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /zh2tw-vannak/ {
            alias E:/copypan/testA/zh2tw/dist/;
            try_files $uri $uri/ /zh2tw-vannak/index.html;
        }

        location /api/testc/feast_outline {
            proxy_pass http://127.0.0.1:8026;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }

        location /api/testc/polish {
            proxy_pass http://127.0.0.1:8013;
            proxy_set_header Host $host;
            proxy_read_timeout 120s;
        }
        location /api/testc/memorial {
            proxy_pass http://127.0.0.1:8013;
            proxy_set_header Host $host;
            proxy_read_timeout 120s;
        }
        location /api/testc/styles {
            proxy_pass http://127.0.0.1:8013;
            proxy_set_header Host $host;
        }
        location /api/testc/roles {
            proxy_pass http://127.0.0.1:8013;
            proxy_set_header Host $host;
        }

        location /api/testc/zh_convert {
            proxy_pass http://127.0.0.1:8006;
            proxy_set_header Host $host;
            proxy_read_timeout 120s;
        }

        location /api/practice/kg_rag/ {
            proxy_pass http://127.0.0.1:8009;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }

        location /api/testc/rough_outline {
            proxy_pass http://127.0.0.1:8029;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }

        location /api/testc/ministerialize {
            proxy_pass http://127.0.0.1:8032;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }

        # testC 简繁互转刷格式（8006）
        location /api/testc/format_download {
            proxy_pass http://127.0.0.1:8006;
            proxy_set_header Host $host;
            proxy_read_timeout 120s;
        }

        location /api/testc/bird_view {
            proxy_pass http://127.0.0.1:8023;
            proxy_set_header Host $host;
            proxy_read_timeout 120s;
        }

        location /api/practice/kg_rag/format_download {
            proxy_pass http://127.0.0.1:8009;
            proxy_set_header Host $host;
            proxy_read_timeout 120s;
        }

        location ^~ /api/testb/bird_view/ {
            proxy_pass http://127.0.0.1:8022;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }

        location ^~ /api/testb/rough_outline {
            proxy_pass http://127.0.0.1:8028;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }

        location ^~ /api/testb/ministerialize/ {
            proxy_pass http://127.0.0.1:8031;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }

        location ^~ /api/testb/qa/ {
            proxy_pass http://127.0.0.1:8041;
            proxy_read_timeout 600s;
            proxy_buffering off;
            proxy_cache off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location ^~ /api/testb/enhanced-translate/ {
            proxy_pass http://127.0.0.1:8061;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }

        location ^~ /api/testb/feast_outline {
            proxy_pass http://127.0.0.1:8025;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }

        location /api {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 600s;
        }

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            try_files $uri =404;
        }

        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
