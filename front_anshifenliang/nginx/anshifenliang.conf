# 按时分粮 — chat.educationbylevel.org
# 安装：sudo cp anshifenliang.conf /etc/nginx/sites-available/
#       sudo ln -sf /etc/nginx/sites-available/anshifenliang.conf /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
# SSL：bash back_anshifenliang/setup-ssl.sh

# HTTP — certbot 验证用；申请证书后会自动加 HTTPS 块
server {
    listen 80;
    listen [::]:80;
    server_name chat.educationbylevel.org;

    root /opt/pansearch/code/front_anshifenliang;
    index index.html;

    # Let's Encrypt 验证
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # 申请 SSL 前可临时用 HTTP；有证书后 setup-ssl.sh 会启用下方 redirect
    # return 301 https://$host$request_uri;

    location /api/ {
        proxy_pass http://127.0.0.1:8020/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # 后端也可直接提供 private/（查看全文 HTML）
    location /private/ {
        proxy_pass http://127.0.0.1:8020/private/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 静态资源（含硬链/软链的数据文件）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 大 JS 数据文件缓存
    location ~* \.(js|css|ico|html)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;
}

