<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title data-i18n="title">按时分粮</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <!-- ✅ 提前语言识别 + 替换 -->
  <script>
    (function () {
      const translations = {
        "zh-CN": {
          title: "按时分粮",
          welcome: "您好！请问有什么可以帮助您的？",
          "input-placeholder": "输入你的问题......",
          "loginTitle": "愿主耶稣基督的恩，神的爱，圣灵的交通，与你们众人同在。（林后十三14）",
          "usernamePlaceholder": "用户名",
          "passwordPlaceholder": "密码",
          "loginButton": "登录",
          // 分类按钮翻译
          "category-hymns": "诗歌",
          "category-verses": "经节",
          "category-commentary": "注解",
          "category-ministry": "职事信息",
          "category-qa": "问答",
          // 其他界面元素
          "category-toggle": "分类",
          "close": "关闭",
          "copy": "复制",
          "read": "朗读",
          "voice-input": "语音输入",
          "send": "发送",
          "test-info": "您可以用测试用户名和测试密码登录",
          "test-credentials": "测试用户名：1　　测试密码：1"
        },
        "zh-TW": {
          title: "按時分糧",
          welcome: "您好！請問有什麼可以幫助您的？",
          "input-placeholder": "輸入你的問題……",
          "loginTitle": "願主耶穌基督的恩，神的愛，聖靈的交通，與你們眾人同在。（林後十三14）",
          "usernamePlaceholder": "使用者名稱",
          "passwordPlaceholder": "密碼",
          "loginButton": "登入",
          // 分類按鈕翻譯
          "category-hymns": "詩歌",
          "category-verses": "經節",
          "category-commentary": "註解",
          "category-ministry": "職事信息",
          "category-qa": "問答",
          // 其他界面元素
          "category-toggle": "分類",
          "close": "關閉",
          "copy": "複製",
          "read": "朗讀",
          "voice-input": "語音輸入",
          "send": "傳送",
          "test-info": "您可以用測試使用者名稱和測試密碼登入",
          "test-credentials": "測試使用者名稱：1　　測試密碼：1"
        }
      };

      const lang = navigator.language || navigator.userLanguage;
      const isTW = lang.startsWith("zh-TW") || lang.startsWith("zh-HK") || lang.startsWith("zh-MO");
      const selected = isTW ? "zh-TW" : (translations[lang] ? lang : "zh-CN");
      window.selectedLang = selected;

      document.addEventListener("DOMContentLoaded", () => {
        const t = translations[selected];

        // 页面其他翻译
        document.querySelectorAll("[data-i18n]").forEach(el => {
          const key = el.getAttribute("data-i18n");
          if (t[key]) el.textContent = t[key];
        });
        document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
          const key = el.getAttribute("data-i18n-placeholder");
          if (t[key]) el.setAttribute("placeholder", t[key]);
        });
        document.querySelectorAll("[data-i18n-title]").forEach(el => {
          const key = el.getAttribute("data-i18n-title");
          if (t[key]) el.setAttribute("title", t[key]);
        });

        // ✅ 登录模态翻译
        const loginModal = document.getElementById("loginModal");
        if (loginModal) {
          const titleEl = loginModal.querySelector(".modal-title");
          const userInput = document.getElementById("login-username");
          const passInput = document.getElementById("login-password");
          const loginBtn = document.getElementById("login-submit");

          if (titleEl) titleEl.textContent = t.loginTitle;
          if (userInput) userInput.placeholder = t.usernamePlaceholder;
          if (passInput) passInput.placeholder = t.passwordPlaceholder;
          if (loginBtn) loginBtn.textContent = t.loginButton;
        }
      });
    })();
  </script>
  <!-- 统一版本变量 + 自动加载 CSS 和 JS -->
  <script>
    const version = '418'; // ✅ 只需修改这里即可更新所有资源缓存！

    const resources = [
      { type: 'css', href: `styles.css?v=${version}` },
      { type: 'js', src: `traditional_to_simplified.js?v=${version}` },
      { type: 'js', src: `simplified_to_traditional.js?v=${version}` },
      { type: 'js', src: `https://cdn.jsdelivr.net/npm/fuse.js@6.6.2/dist/fuse.min.js`, external: true },
      { type: 'js', src: `qu-bie-ci-exclusion-map.js?v=${version}` },      
      { type: 'js', src: `hymns.js?v=${version}` },
      { type: 'js', src: `shi_ge.js?v=${version}` },
      { type: 'js', src: `zhu_jie_wen_da.js?v=${version}` },
      { type: 'js', src: `cha_kan_zheng_pian.js?v=${version}` },
      { type: 'js', src: `jing_jie_wen_da.js?v=${version}` },
      { type: 'js', src: `xiao_bai_ke.js?v=${version}` },
      { type: 'js', src: `shu-ling-wen-da.js?v=${version}` },
      { type: 'js', src: `bible_verse.js?v=${version}` },
      // ✅ 新增职事相关数据文件
      { type: 'js', src: `private/1_zhi_shi_xin_xi.js?v=${version}` },
      { type: 'js', src: `jing_jie_zhu_shi.js?v=${version}` },
      { type: 'js', src: `api_config.js?v=${version}` },
      { type: 'js', src: `scripts.js?v=${version}` },
    ];

    for (const res of resources) {
      if (res.type === 'css') {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = res.href;
        document.head.appendChild(link);
      } else if (res.type === 'js') {
        const script = document.createElement('script');
        script.src = res.src;
        if (res.external) script.crossOrigin = "anonymous";
        document.head.appendChild(script);
      }
    }
  </script>
</head>

<body data-lang="">
  <div class="font-controls">
    <button onclick="adjustFontSize(1)">A+</button>
    <button onclick="adjustFontSize(-1)">A-</button>
  </div>  
  <div class="chat-container">
    <div class="header" data-i18n="title">按时分粮</div>
    <div id="history" class="history">
      <div class="message bot">
        <div class="avatar">B</div>
        <div class="content" data-i18n="welcome">您好！请问有什么可以帮助您的？</div>
      </div>  
    </div>
    <div class="category-container">
      <button id="category-toggle" class="category-button" data-i18n="category-toggle">分类</button>
      <div id="category-options" class="category-options hidden">
        <button data-category="诗歌" data-i18n="category-hymns">诗歌</button>
        <button data-category="经节" data-i18n="category-verses">经节</button>
        <button data-category="注解" data-i18n="category-commentary">注解</button>
        <button data-category="职事信息" data-i18n="category-ministry">职事信息</button>
        <button data-category="问答" data-i18n="category-qa">问答</button>
      </div>
    </div>  
    <div class="input-container">
      <div class="textarea-wrapper">
        <textarea id="user-input" placeholder="输入你的问题......" data-i18n-placeholder="input-placeholder" required></textarea>

        <!-- 语音输入按钮 -->
        <button id="voice-button" type="button" data-i18n-title="voice-input" title="语音输入">
          <svg width="20" height="24" viewBox="0 0 20 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="#5F6368"
              d="M10 15c1.8 0 3.2-1.4 3.2-3.2V5.5C13.2 3.7 11.8 2.2 10 2.2s-3.2 1.4-3.2 3.2v6.3c0 1.8 1.4 3.2 3.2 3.2z" />
            <path fill="#5F6368"
              d="M15 11c0 3.8-2.4 5.8-5 5.8s-5-2-5-5.8H3.5c0 4.3 2.7 6.5 6 6.8V19h1.5v-1.2c3.3-0.3 6-2.5 6-6.8h-1.5z" />
            <path fill="#5F6368"
              d="M7.25 20h7c0.8 0 1.2 0.5 1.2 1.5S14.3 23 13.5 23h-7c-0.8 0-1.2-0.5-1.2-1.5S5.7 20 6.5 20z" />
          </svg>
        </button>

        <!-- 发送按钮 -->
        <button id="send-button" type="button" data-i18n-title="send" title="发送">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="24px" height="24px">
            <circle cx="12" cy="12" r="12" fill="#5F6368"></circle>
            <path d="M12 16V8M12 8L8 12M12 8L16 12" stroke="white" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- 查看全文模态窗口结构 -->
  <div id="infoModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <button class="close" data-i18n="close">关闭</button>
        <div class="modal-tools">
          <button class="copy-modal-content" data-i18n="copy">复制</button>
          <button class="read-modal-content" data-i18n="read">朗读</button>
        </div>
      </div>
      <h3 class="modal-title"></h3>
      <div class="modal-body"></div>
    </div>
  </div>
