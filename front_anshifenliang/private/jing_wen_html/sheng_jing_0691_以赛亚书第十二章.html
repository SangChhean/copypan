<!DOCTYPE html>

    <style>
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            line-height: 1.8;
            margin: 0;
            padding: 20px;
            background-color: #fafafa;

            font-size: 16px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;

            padding: 15px;

        }
        
        .main-title {
            text-align: center;

            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
            padding-bottom: 8px;
            position: relative;
        }
        
        .main-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 2px;
            background-color: #3498db;
        }
        
        .book-info {
            margin-bottom: 10px;
            padding: 6px 0;
            border-left: 3px solid #3498db;
            padding-left: 12px;
            background-color: #f8f9fa;
            border-radius: 0 5px 5px 0;
            font-size: 14px;
        }
        
        .theme {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #e74c3c;
            margin: 15px 0;
            padding: 12px;
            background-color: #fdf2f2;
            border-radius: 8px;
            border: 1px solid #fadbd8;
        }
        
        .outline {
            margin: 8px 0;
            padding: 6px 12px;
            background-color: #e8f4fd;
            border-left: 4px solid #95a5a6;
            border-radius: 0 5px 5px 0;

        }
        
        
        .outline.level-1 { border-left-color: #e74c3c; font-weight: bold; margin-left: 0; }
        .outline.level-2 { border-left-color: #f39c12; font-weight: bold; margin-left: 0; }
        .outline.level-3 { border-left-color: #3498db; font-weight: bold; margin-left: 0; }
        .outline.level-4 { border-left-color: #27ae60; font-weight: bold; margin-left: 0; }
        .outline.level-5 { border-left-color: #9b59b6; font-weight: bold; margin-left: 0; }
        .outline.level-6 { border-left-color: #34495e; font-weight: bold; margin-left: 0; }
        
        .chapter-title {
            text-align: center;
            font-size: 20px;
            font-weight: bold;

<body>
    <div class="container">
        <h1 class="main-title">以赛亚书 第 十二 章</h1>
        <div class="outline level-2">八　为耶和华所爱之子民享受的救恩 十二1～6</div>
        <div class="verse"><span class="verse-number">12:1</span><span class="verse-text">到那日，你必说，耶和华阿，我要<sup class="clickable-sup" data-sup-text="1" tabindex="0" role="button">1</sup>赞美你。你虽曾向我发怒，你的怒气却已转消，你又安慰了我。</span></div>
        <div class="verse"><span class="verse-number">12:2</span><span class="verse-text">看哪，<sup class="clickable-sup" data-sup-text="1" tabindex="0" role="button">1</sup>神是我的拯救；我要信靠祂，并不惧怕；因为<sup class="clickable-sup" data-sup-text="2" tabindex="0" role="button">2</sup>主<sup class="clickable-sup" data-sup-text="1" tabindex="0" role="button">1</sup>耶和华是我的<sup class="clickable-sup" data-sup-text="3" tabindex="0" role="button">3</sup>力量，是我的诗歌，祂也成了我的拯救。</span></div>
        <div class="verse"><span class="verse-number">12:3</span><span class="verse-text">所以你们必从<sup class="clickable-sup" data-sup-text="1" tabindex="0" role="button">1</sup>救恩之泉欢然取<sup class="clickable-sup" data-sup-text="2" tabindex="0" role="button">2</sup>水，</span></div>
        <div class="verse"><span class="verse-number">12:4</span><span class="verse-text">在那日，你们要说，当称谢耶和华，<sup class="clickable-sup" data-sup-text="1" tabindex="0" role="button">1</sup>呼求祂的名！<sup class="clickable-sup" data-sup-text="2" tabindex="0" role="button">2</sup>将祂所行的传扬在万民中，题说祂的名已被尊崇。</span></div>
        <div class="verse"><span class="verse-number">12:5</span><span class="verse-text">你们要向耶和华歌颂，因祂所行的甚是超绝！但愿这事传遍全地！</span></div>
        <div class="verse"><span class="verse-number">12:6</span><span class="verse-text">锡安的居民哪，当扬声<sup class="clickable-sup" data-sup-text="1" tabindex="0" role="button">1</sup>欢呼，因为以色列的圣者在你们中间乃为至大。</span></div>
    </div>
</body>
