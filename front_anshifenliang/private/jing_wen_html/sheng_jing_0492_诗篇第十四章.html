    <style>

            padding-bottom: 8px;
            position: relative;
        }
        
        .main-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 2px;
            background-color: #3498db;
        }
        
        .book-info {
            margin-bottom: 10px;
            padding: 6px 0;
            border-left: 3px solid #3498db;
            padding-left: 12px;
            background-color: #f8f9fa;
            border-radius: 0 5px 5px 0;
            font-size: 14px;
        }
        
        .theme {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #e74c3c;
            margin: 15px 0;
            padding: 12px;
            background-color: #fdf2f2;
            border-radius: 8px;
            border: 1px solid #fadbd8;
        }
        
        .outline {
            margin: 8px 0;
            padding: 6px 12px;
            background-color: #e8f4fd;
            border-left: 4px solid #95a5a6;
            border-radius: 0 5px 5px 0;

            font-weight: normal;
        }
        
        
        .outline.level-1 { border-left-color: #e74c3c; font-weight: bold; margin-left: 0; }

        .outline.level-3 { border-left-color: #3498db; font-weight: bold; margin-left: 0; }
        .outline.level-4 { border-left-color: #27ae60; font-weight: bold; margin-left: 0; }

<body>
    <div class="container">
        <h1 class="main-title">诗篇 第 十四 章</h1>
        <div class="verse"><span class="verse-number">14:1</span><span class="verse-text">愚顽人心里说，没有神。他们都是败坏，行了可憎恶的事；没有一个人行善。</span></div>
        <div class="verse"><span class="verse-number">14:2</span><span class="verse-text">耶和华从天上垂看世人，要看有明白的没有，有寻求神的没有。</span></div>
        <div class="verse"><span class="verse-number">14:3</span><span class="verse-text">他们都是偏离正路，一同变为败坏；没有行善的，连一个也没有。</span></div>
        <div class="verse"><span class="verse-number">14:4</span><span class="verse-text">作孽的都没有知识么？他们吞吃我的百姓，如同吃饭一样，并不呼求耶和华。</span></div>
        <div class="verse"><span class="verse-number">14:5</span><span class="verse-text">他们在那里大大的害怕，因为神是在义人的族类中。</span></div>
        <div class="verse"><span class="verse-number">14:6</span><span class="verse-text">你们叫困苦人的谋算变为羞辱，然而耶和华是他们的避难所。</span></div>
        <div class="verse"><span class="verse-number">14:7</span><span class="verse-text">但愿以色列的救恩从锡安而出！耶和华使祂被掳的子民归回，那时雅各要欢腾，以色列要喜乐。</span></div>
    </div>
</body>
