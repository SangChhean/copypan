    function disableCopyFeatures() {
      document.addEventListener('contextmenu', e => e.preventDefault());
      document.addEventListener('copy', e => e.preventDefault());
      document.addEventListener('cut', e => e.preventDefault());
      document.addEventListener('dragstart', e => e.preventDefault());
      document.addEventListener('selectstart', e => e.preventDefault());
    }

    // ✅ 字体缩放
    const fontSizes = [16, 18, 20, 22, 24, 26];
    let currentIndex = 2;
    function applyFontSize() {
      const size = fontSizes[currentIndex];
      document.documentElement.style.fontSize = size + 'px';
    }
    function changeFontSize(delta) {
      currentIndex = Math.max(0, Math.min(fontSizes.length - 1, currentIndex + delta));
      applyFontSize();
    }
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("fontMinus").addEventListener("click", () => changeFontSize(-1));
      document.getElementById("fontPlus").addEventListener("click", () => changeFontSize(1));
      applyFontSize();
    });

    function adaptCloseButtonText() {
      const lang = navigator.language || navigator.userLanguage;
      const isTraditional = lang === "zh-TW" || lang === "zh-HK" || lang.startsWith("zh-Hant");
      const closeText = isTraditional ? "關閉" : (lang.startsWith("en") ? "Close" : "关闭");
      const closeBtn = document.getElementById("closeBtn");
      if (closeBtn) closeBtn.textContent = closeText;
    }

    function adjustDivIndentation() {
      const divs = document.querySelectorAll('div[style*="text-align: justify"]');
      const keywords = ["读经", "讀經", "祷告", "禱告", "纲目", "綱目"];
      divs.forEach(div => {
        const html = div.innerHTML.trim();
        for (const kw of keywords) {
          const regex = new RegExp(`^<strong>${kw}\\s*[:：]`);
          if (regex.test(html)) {
            div.style.textIndent = '0';
            break;
          }
        }
      });
    }

    function markOutlineDivs() {
      const divs = document.querySelectorAll('div[style*="text-align: justify"]');
      divs.forEach(div => {
        const text = div.textContent.trim();
        if (/^[壹贰叁肆伍陆柒捌玖拾百千〇零貳参]+[　\s]/.test(text)) {
          div.classList.add("outline", "level1");
        } else if (/^[一二三四五六七八九十百千]+[　\s]/.test(text)) {
          div.classList.add("outline", "level2");
        } else if (/^[0-9]+[　\s]/.test(text)) {
          div.classList.add("outline", "level3");
        } else if (/^[a-zａ-ｚ]+[　\s]/i.test(text)) {
          div.classList.add("outline", "level4");
        } else if (/^[（(][一二三四五六七八九十百千]+[)）][　\s]?/.test(text)) {
          div.classList.add("outline", "level5");
        } else {
          div.classList.add("normal-indent");
        }
      });
    }

    // ✅ 新增：过滤黑名单关键词
    function filterBlacklistKeywords(xiaoBaiKeData) {
      console.log('🚫 开始过滤黑名单关键词...');
      const originalCount = Object.keys(xiaoBaiKeData).length;
      
      const filteredData = {};
      const excludeSet = new Set(excludeKeywords);
      
      for (const keyword in xiaoBaiKeData) {
        if (!excludeSet.has(keyword)) {
          filteredData[keyword] = xiaoBaiKeData[keyword];
        } else {
          console.log(`🚫 过滤黑名单关键词: "${keyword}"`);
        }
      }
      
      const filteredCount = Object.keys(filteredData).length;
      console.log(`✅ 黑名单过滤完成，原始: ${originalCount}，过滤后: ${filteredCount}，过滤掉: ${originalCount - filteredCount}`);
      
      return filteredData;
    }

    // ✅ 新增：识别受保护区域（H3标签和"读经："段落）
    function identifyProtectedAreas(text) {
      console.log('🛡️ 开始识别受保护区域...');
      const protectedAreas = [];
      let attempts = 0;
      const maxAttempts = 1000; // 防止无限循环
      
      try {
        // 1. 识别所有 H3 标签区域
        const h3Regex = /<h3[^>]*>.*?<\/h3>/gi;
        let match;
        while ((match = h3Regex.exec(text)) !== null && attempts < maxAttempts) {
          protectedAreas.push({
            type: 'h3',
            start: match.index,
            end: match.index + match[0].length,
            content: match[0]
          });
          console.log(`🛡️ 发现H3保护区域: ${match.index}-${match.index + match[0].length}`);
          attempts++;
        }
        
        // 2. 识别以"读经："或"讀經："开头的段落区域（简化正则表达式）
        // 使用更简单且安全的匹配方式
        const readingPatterns = [
          /<div[^>]*>[^<]*(?:读经|讀經)\s*[:：][^<]*<\/div>/gi,
          /<p[^>]*>[^<]*(?:读经|讀經)\s*[:：][^<]*<\/p>/gi,
          /<strong>[^<]*(?:读经|讀經)\s*[:：][^<]*<\/strong>/gi
        ];
        
        attempts = 0; // 重置计数器
        for (const regex of readingPatterns) {
          regex.lastIndex = 0; // 重置正则表达式索引
          while ((match = regex.exec(text)) !== null && attempts < maxAttempts) {
            protectedAreas.push({
              type: 'reading',
              start: match.index,
              end: match.index + match[0].length,
              content: match[0]
            });
            console.log(`🛡️ 发现读经段落保护区域: ${match.index}-${match.index + match[0].length}`);
            attempts++;
          }
        }
        
        // 3. 按起始位置排序并合并重叠区域
        protectedAreas.sort((a, b) => a.start - b.start);
        const mergedAreas = [];
        
        for (const area of protectedAreas) {
          const lastArea = mergedAreas[mergedAreas.length - 1];
          if (lastArea && area.start <= lastArea.end) {
            // 合并重叠区域
            lastArea.end = Math.max(lastArea.end, area.end);
            lastArea.type = `${lastArea.type}+${area.type}`;
          } else {
            mergedAreas.push(area);
          }
        }
        
        console.log(`✅ 受保护区域识别完成，找到 ${mergedAreas.length} 个区域`);
        return mergedAreas;
        
      } catch (error) {
        console.error('❌ 识别受保护区域时发生错误:', error);
        return []; // 发生错误时返回空数组，确保程序能继续运行
      }
    }

    // ✅ 新增：检查位置是否在受保护区域内
    function isInProtectedArea(start, end, protectedAreas) {
      for (const area of protectedAreas) {
        // 检查是否有重叠
        if (!(end <= area.start || start >= area.end)) {
          return true;
        }
      }
      return false;
    }

    // ✅ 新增：构建首字符索引（优化性能并过滤黑名单）
    function buildFirstCharIndex(xiaoBaiKeData) {
      console.log('🏗️ 开始构建首字符索引...');
      const startTime = performance.now();
      
      const index = {};
      const keywords = Object.keys(xiaoBaiKeData);
      
      for (const keyword of keywords) {
        if (!keyword || keyword.length === 0) continue;
        
        const firstChar = keyword[0];
        if (!index[firstChar]) {
          index[firstChar] = [];
        }
        index[firstChar].push(keyword);
      }
      
      // 每组内按长度降序排列，确保长关键词优先
      for (const char in index) {
        index[char].sort((a, b) => b.length - a.length);
      }
      
      const endTime = performance.now();
      console.log(`✅ 首字符索引构建完成，耗时: ${(endTime - startTime).toFixed(2)}ms`);
      console.log(`📊 索引分组数: ${Object.keys(index).length}`);
      
      return index;
    }

    // ✅ 修改：使用首字符索引进行快速关键词匹配（增加黑名单和区域过滤）
    function processKeywordLinksOptimized(text, xiaoBaiKeData) {
      if (!xiaoBaiKeData || typeof xiaoBaiKeData !== 'object') {
        console.warn('⚠️ xiaoBaiKeData 不存在，跳过关键词处理');
        return text;
      }
      
      // ✅ 新增：过滤黑名单关键词
      const filteredData = filterBlacklistKeywords(xiaoBaiKeData);
      const keywords = Object.keys(filteredData);
      
      if (keywords.length === 0) {
        console.warn('⚠️ 过滤后的关键词数据为空，跳过关键词处理');
        return text;
      }
      
      console.log(`🔗 开始处理关键词链接，文本长度: ${text.length}, 过滤后关键词数量: ${keywords.length}`);
      const startTime = performance.now();
      
      // ✅ 新增：识别受保护区域
      const protectedAreas = identifyProtectedAreas(text);
      
      // 构建首字符索引
      const firstCharIndex = buildFirstCharIndex(filteredData);
      
      const occupied = new Array(text.length).fill(false);
      const matches = [];
      const matchedKeywords = new Set();
      
      // 遍历文本的每个字符
      for (let i = 0; i < text.length; i++) {
        if (occupied[i]) continue;
        
        const currentChar = text[i];
        const candidateKeywords = firstCharIndex[currentChar];
        
        if (!candidateKeywords) continue;
        
        // 只检查以当前字符开头的关键词（已按长度降序排列）
        for (const keyword of candidateKeywords) {
          if (matchedKeywords.has(keyword)) continue;
          
          const keywordEnd = i + keyword.length;
          
          // 检查是否匹配且位置可用
          if (keywordEnd <= text.length && 
              text.substring(i, keywordEnd) === keyword &&
              isRangeAvailable(occupied, i, keyword.length)) {
            
            // ✅ 新增：检查是否在受保护区域内
            if (isInProtectedArea(i, keywordEnd, protectedAreas)) {
              console.log(`🛡️ 关键词"${keyword}"位于受保护区域，跳过处理`);
              continue;
            }
            
            // 找到匹配，标记位置并记录
            markRange(occupied, i, keyword.length);
            matches.push({
              keyword: keyword,
              start: i,
              end: keywordEnd
            });
            matchedKeywords.add(keyword);
            
            console.log(`✅ 匹配关键词: "${keyword}" 位置: ${i}-${keywordEnd}`);
            break; // 找到最长匹配后跳出内层循环
          }
        }
      }
      
      if (matches.length === 0) {
        const endTime = performance.now();
        console.log(`📝 未找到匹配的关键词，耗时: ${(endTime - startTime).toFixed(2)}ms`);
        return text;
      }
      
      // 按位置倒序排列，从后往前替换避免位置偏移
      matches.sort((a, b) => b.start - a.start);
      
      let result = text;
      for (const match of matches) {
        const before = result.substring(0, match.start);
        const after = result.substring(match.end);
        const linkedKeyword = `<span class="keyword-link" data-keyword="${match.keyword}">${match.keyword}</span>`;
        result = before + linkedKeyword + after;
      }
      
      const endTime = performance.now();
      console.log(`✅ 关键词处理完成，添加了 ${matches.length} 个链接，总耗时: ${(endTime - startTime).toFixed(2)}ms`);
      console.log(`🛡️ 受保护区域数量: ${protectedAreas.length}`);
      
      return result;
    }

    // ✅ 新增：检查位置范围是否可用
    function isRangeAvailable(occupied, start, length) {
      for (let i = start; i < start + length; i++) {
        if (occupied[i]) {
          return false;
        }
      }
      return true;
    }

    // ✅ 新增：标记位置范围为已占用
    function markRange(occupied, start, length) {
      for (let i = start; i < start + length; i++) {
        occupied[i] = true;
      }
    }

    // ✅ 新增：显示关键词解释模态框
    function showBaikeModal(keyword, content) {
    console.log(`📖 显示关键词解释: "${keyword}"`);
    
    const modal = document.getElementById('baikeModal');
    const title = modal.querySelector('.baike-modal-title');
    const body = modal.querySelector('.baike-modal-body');
    const closeBtn = modal.querySelector('.baike-modal-close');
    
    if (!modal || !title || !body) {
        console.error('❌ 模态框元素不存在');
        alert(`${keyword}：${content}`);
        return;
    }
    
    // 设置标题（h3居中）
    title.innerHTML = `<h3 style="text-align: center; margin: 0;">${keyword}</h3>`;
    
    // ✅ 尝试使用主页面的 formatMessage 函数处理内容
    let formattedContent = content;
    
    try {
        console.log('🔍 尝试获取主页面的 formatMessage 函数...');
        
        // 尝试多种方式获取主页面的 formatMessage 函数
        let formatMessage = null;
        
        // 方式1：通过 parent.opener 访问
        if (parent && parent.opener && parent.opener.window && 
            typeof parent.opener.window.formatMessage === 'function') {
        formatMessage = parent.opener.window.formatMessage;
        console.log('✅ 通过 parent.opener 获取到 formatMessage 函数');
        }
        // 方式2：通过 window.opener 访问
        else if (window.opener && window.opener.window && 
                typeof window.opener.window.formatMessage === 'function') {
        formatMessage = window.opener.window.formatMessage;
        console.log('✅ 通过 window.opener 获取到 formatMessage 函数');
        }
        // 方式3：通过 parent.parent 访问
        else if (parent && parent.parent && 
                typeof parent.parent.formatMessage === 'function') {
        formatMessage = parent.parent.formatMessage;
        console.log('✅ 通过 parent.parent 获取到 formatMessage 函数');
        }
        
        if (formatMessage) {
        console.log('🎨 开始使用 formatMessage 处理内容...');
        formattedContent = formatMessage(content);
        console.log('✅ formatMessage 处理完成');
        } else {
        console.warn('⚠️ 未找到 formatMessage 函数，使用备用格式化');
        formattedContent = simpleFormatContent(content);
        }
        
    } catch (error) {
        console.error('❌ 调用 formatMessage 失败:', error);
        console.log('🔄 回退到备用格式化方案');
        formattedContent = simpleFormatContent(content);
    }
    
    // 设置内容
    body.innerHTML = formattedContent;
    
    // 显示模态框
    modal.style.display = 'block';
    
    // ✅ 关闭事件处理（参考 showHymnModal 的完整逻辑）
    const closeModal = () => {
        modal.style.display = 'none';
        document.removeEventListener('keydown', handleEscape);
        console.log('🔒 关键词解释模态框已关闭');
    };
    
    // 关闭按钮点击
    closeBtn.onclick = closeModal;
    
    // 点击背景关闭
    modal.onclick = (e) => {
        if (e.target === modal) {
        closeModal();
        }
    };
    
    // ESC 键关闭
    function handleEscape(e) {
        if (e.key === 'Escape') {
        closeModal();
        }
    }
    document.addEventListener('keydown', handleEscape);
    
    console.log(`✅ 关键词解释模态框已显示: "${keyword}"`);
    }

    // ✅ 备用的简单格式化函数（当无法获取 formatMessage 时使用）
    function simpleFormatContent(content) {
    console.log('🛠️ 使用简单格式化处理内容');
    
    if (!content || typeof content !== 'string') {
        return '<p>内容为空</p>';
    }
    
    // 基本的格式化处理
    let formatted = content
        // 处理双换行为段落分隔
        .replace(/\n\s*\n/g, '</p><p>')
        // 处理单换行为换行符
        .replace(/\n/g, '<br>')
        // 在开头和结尾添加段落标签
        .replace(/^/, '<p>')
        .replace(/$/, '</p>')
        // 处理多个连续的段落标签
        .replace(/<\/p><p>/g, '</p>\n<p>')
        // 处理参考信息的特殊样式
        .replace(/(参考信息\s*[:：])/g, '</p><p><strong>$1</strong><br>')
        // 处理经节引用的加粗样式
        .replace(/(\[[^\]]+\])/g, '<strong>$1</strong>');
    
    // 清理可能的空段落
    formatted = formatted
        .replace(/<p>\s*<\/p>/g, '')
        .replace(/<p>\s*<br>\s*<\/p>/g, '')
        .trim();
    
    console.log('✅ 简单格式化完成');
    return formatted;
    }


    // ✅ 新增：设置关键词点击事件监听
    function setupKeywordClickHandler(xiaoBaiKeData) {
      document.addEventListener('click', function(event) {
        const keywordLink = event.target.closest('.keyword-link');
        if (!keywordLink) return;
        
        event.preventDefault();
        event.stopPropagation();
        
        const keyword = keywordLink.dataset.keyword;
        console.log('🔗 用户点击关键词链接:', keyword);
        
        if (!xiaoBaiKeData || !xiaoBaiKeData[keyword]) {
          console.error(`❌ 关键词"${keyword}"对应的内容不存在`);
          alert(`抱歉，未找到"${keyword}"的解释内容`);
          return;
        }
        
        const content = xiaoBaiKeData[keyword];
        showBaikeModal(keyword, content);
      });
    }

    // ✅ 修改：现有的消息监听器（集成关键词处理功能）
    window.addEventListener("message", function(event) {
      if (event.data && event.data.type === "zheng-pian-content") {
        let html = event.data.content || "";
        
        console.log('📨 接收到内容消息，开始处理...');
        
        // ✅ 新增：获取关键词数据并进行处理（包含黑名单和区域过滤）
        const xiaoBaiKeData = getXiaoBaiKeData();
        if (Object.keys(xiaoBaiKeData).length > 0) {
          html = processKeywordLinksOptimized(html, xiaoBaiKeData);
          
          // 设置关键词点击监听器
          setupKeywordClickHandler(xiaoBaiKeData);
        } else {
          console.warn('⚠️ 未获取到关键词数据，跳过关键词处理');
        }

        // ✅ 保持原有功能：繁体转换
        if (isTraditionalLocale() && typeof convertToTraditional === "function") {
          html = convertToTraditional(html);
        }

        // ✅ 保持原有功能：格式处理
        html = html.replace(
          /<div[^>]*?>\s*(綱目|纲目)\s*<\/div>/gi,
          (_, keyword) => `<div class="hanging-indent"><strong>${keyword}</strong></div>`
        );

        html = html.replace(
          /<div[^>]*text-align:\s*(center|justify)[^>]*?>\s*(<strong>)?\s*(讀經|读经|祷告|禱告|綱目|纲目)\s*[:：]\s*(.*?)<\/div>/gi,
          (_, align, strong, keyword, rest) => {
            return `<div class="hanging-indent"><strong>${keyword}：</strong>${rest.trim()}</div>`;
          }
        );

        // ✅ 保持原有功能：标题处理
        const h3Match = html.match(/<h3[^>]*>(.*?)<\/h3>/i);
        const titleText = h3Match ? h3Match[1].replace(/<[^>]*>/g, "").trim() : "内容";
        document.title = titleText;
        
        // ✅ 显示最终内容
        document.getElementById("insert").innerHTML = html;

        // ✅ 保持原有功能：格式调整
        adjustDivIndentation();
        markOutlineDivs();
        
        console.log('✅ 内容处理和显示完成');
      }
    }, false);
  </script>
